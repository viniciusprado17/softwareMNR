; Firmware do receptor (ligado por USB ao Raspberry Pi).
; Compilar/gravar: cd firmware/receiver && pio run -t upload && pio device monitor
[platformio]
lib_dir = ../lib
include_dir = ../include

[env:heltec_v3_receiver]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DLORA_FREQ_MHZ=915.0
lib_deps =
    jgromes/RadioLib@6.6.0
    adafruit/Adafruit SSD1306@2.5.10
    adafruit/Adafruit GFX Library@1.11.9
    https://github.com/kmackay/micro-ecc.git#541b3a78026420a3e369c4c9281c396b5e531113
