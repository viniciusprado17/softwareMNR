; Kit de bancada: um teste isolado por ambiente, sem chaves e sem assinatura.
; Roteiro em docs/GUIA_HARDWARE.md ("Roteiro de bancada"). Exemplo:
;   pio run -d firmware/bench -e lifetest -t upload && pio device monitor -b 115200
; Sem default_envs de proposito: "pio run -d firmware/bench" compila todos (CI).
; Versoes FIXAS, iguais as de firmware/node/platformio.ini.
[platformio]
lib_dir = ../lib
include_dir = ../include

[env]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DLORA_FREQ_MHZ=915.0
lib_deps =
    jgromes/RadioLib@6.6.0
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit SSD1306@2.5.10
    adafruit/Adafruit GFX Library@1.11.9

; Etapa 4: teste de vida (display e LED)
[env:lifetest]
build_src_filter = +<lifetest.cpp>

; Etapa 5: varredura do barramento I2C do sensor
[env:i2cscan]
build_src_filter = +<i2cscan.cpp>

; Etapas 5 e 6: sensor + estado no display
[env:sensor]
build_src_filter = +<sensor.cpp>

; Etapa 7: radio, lado que envia
[env:ping_tx]
build_src_filter = +<ping.cpp>
build_flags =
    ${env.build_flags}
    -DPING_TX=1

; Etapa 7: radio, lado que recebe
[env:ping_rx]
build_src_filter = +<ping.cpp>
build_flags =
    ${env.build_flags}
    -DPING_TX=0
