; Firmware de teste dos vetores dourados (T4/T5). Sem radio, sem sensor.
; cd firmware/vectest && pio run -t upload && python ../../tools/check_fw_output.py --vectors --port /dev/ttyUSB0
[platformio]
lib_dir = ../lib
include_dir = ../include

[env:heltec_v3_vectest]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -Wall
