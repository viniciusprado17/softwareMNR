; Firmware do no sensor. Compilar/gravar: cd firmware/node && pio run -t upload && pio device monitor
; Versoes FIXAS (Secao 7.4): espressif32 6.9.0 = core Arduino-ESP32 2.0.17.
[platformio]
lib_dir = ../lib
include_dir = ../include
default_envs = heltec_v3_node

[env]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DLORA_FREQ_MHZ=915.0
lib_deps =
    jgromes/RadioLib@6.6.0
    adafruit/Adafruit SHT31 Library@2.2.2
    adafruit/Adafruit SSD1306@2.5.10
    adafruit/Adafruit GFX Library@1.11.9

; No real com SHT31-D
[env:heltec_v3_node]

; Sem SHT31-D (sensor falso, oscila 1-9 C): para testar radio/assinatura antes do sensor chegar
[env:heltec_v3_node_fake_sensor]
build_flags =
    ${env.build_flags}
    -DSENSOR_FAKE=1

; Camada 3: com GPS NEO-6M
[env:heltec_v3_node_gps]
build_flags =
    ${env.build_flags}
    -DUSE_GPS=1
lib_deps =
    ${env.lib_deps}
    mikalhart/TinyGPSPlus@1.0.3
